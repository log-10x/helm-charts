# Artifact Hub repository metadata, read from beside index.yaml.
# Format: https://github.com/artifacthub/hub/blob/master/docs/metadata/artifacthub-repo.yml
#
# repositoryID is added once the repository is registered on Artifact Hub,
# which issues it. It is what gives the listing the verified publisher mark.
owners:
  - name: talwgx
    email: engineering@log10x.com
ignore:
  # streamer-10x is the name retriever-10x carried before the rename. Its
  # latest version in index.yaml is marked deprecated, so installs and
  # upgrades by name keep working; Artifact Hub has no reason to list it.
  - name: streamer-10x
