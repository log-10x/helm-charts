{{- if .Values.apiKeySecret.create }}
{{- if not .Values.log10xApiKey }}
{{- fail "log10xApiKey must be set to a valid API key when apiKeySecret.create is true." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "log10x-retriever.fullname" . }}-api-key
  labels:
    {{- include "log10x-retriever.labels" . | nindent 4 }}
  {{- with .Values.apiKeySecret.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{ .Values.apiKeySecret.secretKey }}: {{ .Values.log10xApiKey | b64enc | quote }}
{{- end }}
{{- /*
    Render the git-token Secret whenever the tenx-git-config init container
    will mount it. A missing gitToken is valid for public repos; rendering
    an empty-token Secret keeps pods from hanging in
    CreateContainerConfigError / FailedMount.
    Mirrors the log10x-retriever.gitEnabled gate used in deployment.yaml.
*/ -}}
{{- if include "log10x-retriever.gitEnabled" . }}
{{- if .Values.apiKeySecret.create }}
---
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "log10x-retriever.fullname" . }}-git-token
  labels:
    {{- include "log10x-retriever.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ .Values.gitToken | default "" | b64enc | quote }}
{{- end }}
{{- /*
    Render the Azure storage credential Secret when storage.provider is azure and
    the selected auth method needs one. workloadIdentity has no credential to hold.
    Mirrors the apiKeySecret pattern: create/existingSecret/secretKey.
*/ -}}
{{- if include "log10x-retriever.isAzure" . }}
{{- $auth := (((.Values.storage).azure).auth) | default dict }}
{{- $method := $auth.method | default "workloadIdentity" }}
{{- $secret := $auth.secret | default dict }}
{{- if and (ne $method "workloadIdentity") ($secret.create | default true) (not $secret.existingSecret) }}
{{- $credential := "" }}
{{- if eq $method "servicePrincipal" }}{{ $credential = $auth.clientSecret }}{{ end }}
{{- if eq $method "accountKey" }}{{ $credential = $auth.accountKey }}{{ end }}
{{- if eq $method "sasToken" }}{{ $credential = $auth.sasToken }}{{ end }}
{{- if eq $method "connectionString" }}{{ $credential = $auth.connectionString }}{{ end }}
{{- if or .Values.apiKeySecret.create (include "log10x-retriever.gitEnabled" .) }}
---
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "log10x-retriever.azureCredentialSecretName" . }}
  labels:
    {{- include "log10x-retriever.labels" . | nindent 4 }}
  {{- with $secret.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{ $secret.secretKey | default "azure-credential" }}: {{ $credential | default "" | b64enc | quote }}
{{- end }}
{{- end }}
