{{- if and .Values.scheduledQueries .Values.scheduledQueries.enabled .Values.scheduledQueries.jobs (gt (len .Values.scheduledQueries.jobs) 0) }}
{{- range $job := .Values.scheduledQueries.jobs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "log10x-retriever.fullname" $ }}-{{ $job.name }}
  labels:
    {{- include "log10x-retriever.labels" $ | nindent 4 }}
    component: scheduled-query
    query-job-name: {{ $job.name }}
spec:
  schedule: {{ $job.schedule | quote }}
  suspend: {{ $job.suspend | default false }}
  successfulJobsHistoryLimit: {{ $job.successfulJobsHistoryLimit | default 3 }}
  failedJobsHistoryLimit: {{ $job.failedJobsHistoryLimit | default 1 }}
  concurrencyPolicy: {{ $job.concurrencyPolicy | default "Forbid" }}
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: {{ include "log10x-retriever.name" $ }}
            component: scheduled-query
            query-job-name: {{ $job.name }}
            {{- if include "log10x-retriever.azureWorkloadIdentity" $ }}
            azure.workload.identity/use: "true"
            {{- end }}
        spec:
          serviceAccountName: {{ include "log10x-retriever.serviceAccountName" $ }}
          restartPolicy: {{ $job.restartPolicy | default "OnFailure" }}
          containers:
{{- if include "log10x-retriever.isAzure" $ }}
{{- $azureAuth := ((($.Values.storage).azure).auth) | default dict }}
{{- $azureMethod := $azureAuth.method | default "workloadIdentity" }}
{{- $queueName := include "log10x-retriever.azureQueueName" ((($.Values.storage).azure).queues).query }}
            - name: send-query
              image: "{{ $.Values.scheduledQueries.azureImage.repository }}:{{ $.Values.scheduledQueries.azureImage.tag }}"
              imagePullPolicy: {{ $.Values.scheduledQueries.azureImage.pullPolicy }}
              command: ["/bin/bash"]
              args:
                - -c
                - |
                  set -e
                  {{- if eq $azureMethod "workloadIdentity" }}

                  az login --service-principal \
                    --username "$AZURE_CLIENT_ID" \
                    --tenant "$AZURE_TENANT_ID" \
                    --federated-token "$(cat "$AZURE_FEDERATED_TOKEN_FILE")" > /dev/null
                  {{- else if eq $azureMethod "servicePrincipal" }}

                  az login --service-principal \
                    --username "$AZURE_CLIENT_ID" \
                    --tenant "$AZURE_TENANT_ID" \
                    --password "$AZURE_CLIENT_SECRET" > /dev/null
                  {{- end }}

                  {{- range $query := $job.queries }}
                  QUERY_BODY=$(cat <<'QUERY_EOF'
                  {{ $query | toJson }}
                  QUERY_EOF
                  )

                  echo "Sending query: {{ $query.name | default "unnamed" }}"

                  az storage message put \
                    --queue-name "{{ $queueName }}" \
                    --account-name "$AZURE_STORAGE_ACCOUNT" \
                    {{- if or (eq $azureMethod "workloadIdentity") (eq $azureMethod "servicePrincipal") }}
                    --auth-mode login \
                    {{- else if eq $azureMethod "accountKey" }}
                    --account-key "$AZURE_STORAGE_KEY" \
                    {{- else if eq $azureMethod "sasToken" }}
                    --sas-token "$AZURE_STORAGE_SAS_TOKEN" \
                    {{- else if eq $azureMethod "connectionString" }}
                    --connection-string "$AZURE_STORAGE_CONNECTION_STRING" \
                    {{- end }}
                    --content "$QUERY_BODY"

                  echo "Query sent successfully: {{ $query.name | default "unnamed" }}"
                  {{- end }}

                  echo "All queries sent successfully for job: {{ $job.name }}"
              env:
                {{- include "log10x-retriever.azureAuthEnvVars" $ | nindent 16 }}
{{- else }}
            - name: send-query
              image: "{{ $.Values.scheduledQueries.image.repository }}:{{ $.Values.scheduledQueries.image.tag }}"
              imagePullPolicy: {{ $.Values.scheduledQueries.image.pullPolicy }}
              command: ["/bin/bash"]
              args:
                - -c
                - |
                  set -e

                  {{- range $query := $job.queries }}
                  QUERY_BODY=$(cat <<'QUERY_EOF'
                  {{ $query | toJson }}
                  QUERY_EOF
                  )

                  echo "Sending query: {{ $query.name | default "unnamed" }}"

                  aws sqs send-message \
                    --queue-url "{{ $.Values.queryQueueUrl }}" \
                    --message-body "$QUERY_BODY"

                  echo "Query sent successfully: {{ $query.name | default "unnamed" }}"
                  {{- end }}

                  echo "All queries sent successfully for job: {{ $job.name }}"
              env:
                - name: AWS_DEFAULT_REGION
                  value: {{ $job.awsRegion | default "us-east-1" | quote }}
{{- end }}
          {{- with $.Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
{{- end }}
