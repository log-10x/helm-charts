# Azure Blob Storage with a storage account access key
# Provide the key at install time:
#   helm install my-retriever log10x/retriever-10x \
#     -f azure-account-key-values.yaml \
#     --set-string storage.azure.auth.accountKey="$AZURE_STORAGE_KEY"

# REQUIRED: Set your Log10x API key
log10xApiKey: "YOUR-LOG10X-API-KEY"

# REQUIRED on Azure. The chart's values.yaml ships image.tag: "", which falls
# back to the chart appVersion, and that appVersion predates the Azure Blob
# index and read path. A values file with no image.tag installs an engine that
# cannot do the Azure work.
image:
  tag: "1.1.78"

storage:
  provider: azure
  azure:
    account: "tenxlogs"
    indexContainer: "tenxlogs/index/"
    inputContainer: "rawlogs"

    # Storage Queue names on the account above
    queues:
      index: "index-queue"
      query: "query-queue"
      subquery: "subquery-queue"
      stream: "stream-queue"

    auth:
      method: accountKey
      # SECURITY WARNING: provide via --set-string, do not commit the key
      accountKey: "YOUR-STORAGE-ACCOUNT-KEY"

scheduledQueries:
  enabled: false
