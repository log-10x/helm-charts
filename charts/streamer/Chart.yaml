apiVersion: v2
name: streamer-10x
description: "Deprecated: streamer-10x was renamed retriever-10x. Install log10x/retriever-10x instead (https://github.com/log-10x/helm-charts/tree/main/charts/retriever)."
home: https://github.com/log-10x/helm-charts
type: application
version: 1.0.7
appVersion: 1.0.6
# streamer-10x is the name retriever-10x carried before the streamer to
# retriever rename (#7). This version exists only to mark the name deprecated
# in the index, the way Helm documents: a new version with deprecated: true.
# Its templates and values are 1.0.6's, unchanged, so an upgrade from 1.0.6
# renders the same objects and `helm install log10x/streamer-10x` keeps
# working, with Helm's deprecation warning. New installs use retriever-10x.
# No maintainers: chart-testing rejects a deprecated chart that lists any.
deprecated: true
annotations:
  artifacthub.io/changes: |
    - kind: deprecated
      description: "streamer-10x is deprecated. The chart was renamed retriever-10x; install log10x/retriever-10x. This version changes nothing but the deprecation mark: templates and values are 1.0.6's."
