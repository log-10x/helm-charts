{{- /* validation.yaml fails the render before this can be materialized empty. */ -}}
{{- $licenseJwt := include "log10x-cron.licenseJwt" . -}}
{{- if $licenseJwt }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "log10x-cron.fullname" . }}-tenx-license
  labels:
    {{- include "log10x-cron.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.tenx.licenseSecretKey | default "license-jwt" }}: {{ $licenseJwt | b64enc | quote }}
{{- end }}
{{- /*
    Render the git-token Secret whenever a tenx-git-config init container will
    mount it, which is whenever any job enables config.git or symbols.git. An
    empty token is valid for public repos; rendering the Secret anyway keeps
    pods out of CreateContainerConfigError.
*/ -}}
{{- $gitInit := false -}}
{{- range .Values.jobs }}
  {{- if or (and .config .config.git .config.git.enabled) (and .symbols .symbols.git .symbols.git.enabled) -}}
    {{- $gitInit = true -}}
  {{- end }}
{{- end }}
{{- if $gitInit }}
{{- if $licenseJwt }}
---
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "log10x-cron.fullname" . }}-git-token
  labels:
    {{- include "log10x-cron.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ .Values.gitToken | default "" | b64enc | quote }}
{{- end }}
