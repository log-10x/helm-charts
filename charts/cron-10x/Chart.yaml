apiVersion: v2
name: cron-10x
description: Official Log10x helm chart for running the 10x Compiler as a scheduled CronJob
type: application
version: 1.1.3
# artifacthub.io/images below names this tag. Change both together.
appVersion: 1.1.45
home: https://github.com/log-10x/helm-charts
sources:
  - https://github.com/log-10x/helm-charts
  - https://github.com/log-10x/docker-images
maintainers:
  - name: log10x
    email: engineering@log10x.com
annotations:
  # Artifact Hub finds a chart's images by rendering it with default values.
  # This chart refuses to render without a licence (templates/validation), so
  # the images are listed here instead: the ones an install with a licence
  # and otherwise default values runs.
  artifacthub.io/images: |
    - name: compiler-10x
      image: log10x/compiler-10x:1.1.45
  artifacthub.io/changes: |
    - kind: added
      description: "artifacthub.io/images annotation naming log10x/compiler-10x:1.1.45, so Artifact Hub can scan the image. It cannot find the image on its own: the chart refuses to render with default values, which carry no licence. No template or value changed."
