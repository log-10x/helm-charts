# No path to the Log10x SaaS. The licence is verified locally against the
# embedded public key; nothing is sent to the vendor gateway. Source pulls and
# symbol pushes still happen, those are your own pipelines.
#
# Honored for every licence type, including 'demo' and 'limited'.

tenx:
  airgapped: true
  # The token is managed outside Helm, so it never enters the release values.
  licenseSecret: "tenx-license"
  licenseSecretKey: "license-jwt"

jobs:
  - name: compiler-job
    schedule: "0 * * * *"
    args:
      - "@apps/compiler"
    activeDeadlineSeconds: 3600
    config:
      volume:
        enabled: true
        claimName: "my-config-pvc"
