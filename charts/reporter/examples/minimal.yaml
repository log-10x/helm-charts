# Minimal reporter deployment
# Collects all container logs, reports to Log10x, discards everything.
#
# Usage:
#   helm install log10x-reporter ./charts/reporter -f examples/minimal.yaml \
#     --set log10xLicenseJwt="$(cat license.jwt)"

log10xLicenseJwt: ""  # Set via --set or separate secrets file
runtimeName: "my-reporter"
